{% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" style="background:none; border:none; color:blue; cursor:pointer;">
            Logout
        </button>
    </form>
{% else %}
    <a href="{% url 'login' %}">Login</a>
{% endif %}
