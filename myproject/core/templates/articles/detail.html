{% extends 'core/base.html' %}

{% block content %}
<h2>{{ object.title }}</h2>

<p>{{ object.content }}</p>

{% if request.user == object.author %}
    <a href="{% url 'article_edit' object.id %}">Редактировать</a>
    <a href="{% url 'article_delete' object.id %}">Удалить</a>
{% endif %}

{% endblock %}
